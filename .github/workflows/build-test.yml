name: Build and Test

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - '**/*.go'
      - '**/testdata/**'
      - '.gitattributes'
      - '.github/workflows/build-test.yml'
      - 'go.*'
      - 'scripts/**'
      - 'vendor/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Detect build changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ github.event_name != 'pull_request' || steps.filter.outputs.relevant == 'true' }}
    steps:
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect relevant changes
        if: github.event_name == 'pull_request'
        id: filter
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Compare the entire PR; include deleted and renamed-away paths.
          if git diff --quiet --no-ext-diff --no-renames "$BASE_SHA...$HEAD_SHA" -- \
            ':(glob)**/*.go' \
            ':(glob)**/testdata/**' \
            ':(glob).gitattributes' \
            ':(glob).github/workflows/build-test.yml' \
            ':(glob)go.*' \
            ':(glob)scripts/**' \
            ':(glob)vendor/**'; then
            echo 'relevant=false' >> "$GITHUB_OUTPUT"
          else
            result=$?
            # Exit 1 means differences; any other nonzero result is an error.
            if [ "$result" -ne 1 ]; then exit "$result"; fi
            echo 'relevant=true' >> "$GITHUB_OUTPUT"
          fi

  checks:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    name: Build and Test (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CGO_ENABLED: ${{ matrix.race && '1' || '0' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, goos: darwin, goarch: arm64, race: true }
          - { os: macos-15-intel, goos: darwin, goarch: amd64, race: true }
          - { os: ubuntu-24.04, goos: linux, goarch: amd64, race: true }
          - { os: ubuntu-24.04-arm, goos: linux, goarch: arm64, race: true }
          - { os: windows-11-arm, goos: windows, goarch: arm64, race: false }
          - { os: windows-2025, goos: windows, goarch: amd64, race: true }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Test with Coverage
        if: ${{ !matrix.race }}
        # Quote dotted flag values so PowerShell passes each argument intact.
        run: go test -covermode=atomic '-coverpkg=./...' '-coverprofile=coverage.out' ./...
      - name: Test with Coverage and Race Detection
        if: matrix.race
        run: go test -race -covermode=atomic '-coverpkg=./...' '-coverprofile=coverage.out' ./...
      - name: Upload Coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.goos }}-${{ matrix.goarch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage.out
          if-no-files-found: ignore
          retention-days: 14
      - name: Verify 90% Coverage
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} scripts/check.py coverage coverage.out 90
      - name: Verify Extension
        env:
          GH_TOKEN: ${{ github.token }}
          GHGR_SMOKE_GOOS: ${{ matrix.goos }}
          GHGR_SMOKE_GOARCH: ${{ matrix.goarch }}
        run: go test -tags smoke -count=1 -v -timeout=15m ./integration

  required:
    name: Build and test required
    if: always()
    needs: [changes, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required results
        env:
          DETECTION: ${{ needs.changes.result }}
          RELEVANT: ${{ needs.changes.outputs.relevant }}
          RESULT_CHECKS: ${{ needs.checks.result }}
        run: |
          test "$DETECTION" = success
          case "$RELEVANT" in
            true) expected=success ;;
            false) expected=skipped ;;
            *) exit 1 ;;
          esac
          test "$RESULT_CHECKS" = "$expected"

name: Check Markdown

on:
  pull_request:
    paths:
      - '**/*.markdown'
      - '**/*.md'
      - '.github/workflows/**'
      - '.gitignore'
      - '.markdownlint*'
      - '.release-please-config.json'
      - 'lychee.toml'
  push:
    branches: [main]
    paths:
      - '**/*.markdown'
      - '**/*.md'
      - '.github/workflows/**'
      - '.gitignore'
      - '.markdownlint*'
      - '.release-please-config.json'
      - 'lychee.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdown:
    name: Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress '**/*.md'
          output: ${{ runner.temp }}/lychee-report.md
      - name: Lint Files
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: '**/*.{md,markdown}'

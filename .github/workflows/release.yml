name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Release checks
    uses: ./.github/workflows/ci.yml

  vulnerabilities:
    name: Release vulnerability scan
    uses: ./.github/workflows/vulnerabilities.yml

  smoke:
    name: Release smoke tests
    uses: ./.github/workflows/smoke.yml

  release:
    name: Publish binaries
    needs: [checks, vulnerabilities, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo 'Release tags must use vMAJOR.MINOR.PATCH with optional prerelease/build metadata.' >&2
            exit 1
          fi
      - uses: cli/gh-extension-precompile@76961aa3bd1123d0a6fd42d0a41aca0696937c39 # v2.2.0
        with:
          generate_attestations: true
          go_version_file: go.mod
          go_build_options: '-ldflags=-s -w -X main.version=${{ github.ref_name }}'

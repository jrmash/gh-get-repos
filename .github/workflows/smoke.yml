name: Smoke

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  installed-extension:
    name: Installed extension (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            goos: linux
            goarch: amd64
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - os: macos-15-intel
            goos: darwin
            goarch: amd64
          - os: macos-15
            goos: darwin
            goarch: arm64
          - os: windows-2025
            goos: windows
            goarch: amd64
          - os: windows-11-arm
            goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Verify GitHub CLI and Git
        run: |
          gh --version
          git --version
      - name: Install and exercise the extension against GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          GHGR_SMOKE_GOOS: ${{ matrix.goos }}
          GHGR_SMOKE_GOARCH: ${{ matrix.goarch }}
        run: go test -tags smoke -count=1 -v -timeout=15m ./integration

  smoke:
    name: Smoke
    runs-on: ubuntu-latest
    needs: installed-extension
    if: always()
    permissions: {}
    steps:
      - name: Require every platform and architecture to pass
        env:
          SMOKE_RESULT: ${{ needs.installed-extension.result }}
        run: test "$SMOKE_RESULT" = success

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Setup
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Verify
        run: go mod verify
      - name: Check module metadata
        run: go mod tidy -diff
      - name: Check formatting
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} scripts/check.py format
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Test
        if: runner.os != 'Linux'
        run: go test ./...
      - name: Test with race detection and coverage
        if: runner.os == 'Linux'
        run: go test -race -covermode=atomic -coverpkg=./... -coverprofile=coverage.out ./...
      - name: Enforce 90% statement coverage
        if: runner.os == 'Linux'
        run: python3 scripts/check.py coverage coverage.out 90
      - name: Upload coverage
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage.out
          if-no-files-found: ignore
          retention-days: 14

  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: checks
    if: always()
    permissions: {}
    steps:
      - name: Require every platform to pass
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: test "$CHECKS_RESULT" = success
